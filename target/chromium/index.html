<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <link rel="shortcut icon" href="icons/128.png" id="tabliss-favicon" />
    <script>
      (function() {
        var custom = localStorage.getItem('tabliss/favicon');
        if (custom) {
          document.getElementById('tabliss-favicon').href = custom;
        }
      })();
    </script>
    <style>
      body {background-color: #000;}
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
