name: Update Bundled Icons

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-bundled-icons
  cancel-in-progress: false

jobs:
  update:
    name: Check for Iconify updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Regenerate bundled icons
        run: pnpm icons:generate

      - name: Check for updates
        id: changes
        run: |
          if git diff --quiet -- src/icons/bundled.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/update-bundled-icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/icons/bundled.json
          git commit -m "chore(icons): update bundled icons"
          git push --force origin "HEAD:$BRANCH"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title "chore(icons): update bundled icons" \
              --body "Regenerated the checked-in Iconify bundle using \`pnpm icons:generate\`."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(icons): update bundled icons" \
              --body "Regenerated the checked-in Iconify bundle using \`pnpm icons:generate\`."
          fi
